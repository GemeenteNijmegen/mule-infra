# Checks the client certificate the ALB verified before a request reaches Mule.
# Otherwise this should stay invisible to the Mule apps, so limits are generous.
# Complete config rather than a conf.d snippet: it lives in /tmp, as the
# container runs unprivileged.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # The ALB sends the subject as an RFC 2253 DN, e.g. CN=host,O=org,C=NL. Match
  # the whole CN: a substring would also accept CN=host.example.com or O=host.
  # \x5c is a backslash, so an escaped comma cannot pass as the start of the CN.
  # nginx joins repeated headers with ', ' and treats X_Amzn_Mtls_Clientcert_Subject
  # as the same header, which the ALB does not overwrite. The ALB's own value has
  # no unescaped ', ', so the lookahead rejects such a joined value.
  map $http_x_amzn_mtls_clientcert_subject $client_denied {
    default 1;
    "~^(?!(.*[^\x5c])?, )(.*[^\x5c],)?CN=__CLIENT_CERT_CN__(,|$)" 0;
  }

  log_format denied '$time_iso8601 denied subject="$http_x_amzn_mtls_clientcert_subject" '
    'issuer="$http_x_amzn_mtls_clientcert_issuer" client=$http_x_forwarded_for "$request"';

  server {
    listen 8080;
    server_tokens off;

    # Requests are logged in the ALB access logs, so only keep the rejections.
    access_log /dev/stdout denied if=$client_denied;

    # No body limit or buffering, and keep every header the ALB forwards,
    # including names nginx would otherwise drop (client_id).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    underscores_in_headers on;
    ignore_invalid_headers off;
    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    # Longer than the ALB idle timeout, so the ALB stays the one to time out.
    client_body_timeout 3600s;
    send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host $http_host;

    # ALB health checks carry no client certificate. The URI is fixed on purpose:
    # without it nginx forwards the raw request, so /x/../health would be matched
    # here and still reach Mule as a path other than /health.
    location = /health {
      access_log off;
      proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
      if ($client_denied) {
        return 403;
      }
      proxy_pass http://127.0.0.1:8081;
    }
  }
}
