apiVersion: 1

# The email contact points, DevOps included, are managed in the Grafana UI and
# use these templates; see the README.
templates:
  - orgId: 1
    name: mule-runtime-errors
    template: |
      {{ define "mule-runtime-errors.subject" -}}
      {{- /* Three shapes of alert arrive here: a failing request (entrypoint
      application plus correlationId), a runtime error that belongs to no
      request (application only), and a Grafana-side evaluation failure
      (neither). */ -}}
      Mule errors: {{ if .CommonLabels.correlationId }}{{ .CommonLabels.applicationName }} request {{ .CommonLabels.correlationId }}{{ else if .CommonLabels.applicationName }}{{ .CommonLabels.applicationName }} (geen correlationId){{ else }}runtime alert{{ end }}
      {{- end }}

      {{ define "mule-runtime-errors.message" -}}
      {{- /* .ExternalURL (GF_SERVER_ROOT_URL) is captured up here because the
      per-alert scope inside the range cannot see it. Plain $, not $$: unlike
      contact point settings, templates get no env var interpolation. The
      dashboard window runs from 15m before the alert started (the rule looks back 10m)
      to 2h after; Add takes nanoseconds. */ -}}
      {{ $grafana := .ExternalURL -}}
      {{ range .Alerts -}}
      {{ if index .Labels "applicationName" -}}
      {{ index .Annotations "description" }}

      Gestart: {{ .StartsAt | tz "Europe/Amsterdam" | date "02-01-2006 15:04:05 MST" }}

      {{ if index .Labels "correlationId" -}}
      Bekijk in Grafana - het dashboard met de volledige trace van deze
      request, oudste regel eerst, zodat de entrypoint bovenaan staat:
      {{ else -}}
      Bekijk in Grafana - het dashboard gefilterd op deze applicatie:
      {{ end -}}
      {{ $grafana }}{{ index .Annotations "dashboard_path" }}&from={{ (.StartsAt.Add -900000000000).UnixMilli }}&to={{ (.StartsAt.Add 7200000000000).UnixMilli }}
      {{ else -}}
      Grafana kon de Mule runtime alert niet evalueren ({{ index .Labels "alertname" }}).
      Loki is waarschijnlijk onbereikbaar, dus Mule errors worden op dit moment NIET gedetecteerd.
      Alert: {{ .GeneratorURL }}
      {{ end }}
      {{ end -}}
      {{- end }}

