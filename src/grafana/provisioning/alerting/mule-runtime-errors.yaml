apiVersion: 1

groups:
  - orgId: 1
    name: mule-runtime-errors
    folder: Mule
    # Evaluate every 5m. Each evaluation runs a CloudWatch Logs Insights StartQuery
    # (billed per GB scanned), so a shorter interval multiplies cost directly.
    interval: 5m
    rules:
      - uid: mule-runtime-errors
        title: Mule runtime errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              # 10 min lookback (was 604800 = 7 days). Logs Insights scans every byte in
              # the range on every run; a 7-day window re-scanned each minute is what
              # caused the ~EUR 2.7k CloudWatch bill. 10m covers two full bin(5m) buckets
              # and gives overlap over the 5m interval to absorb log-ingestion lag.
              from: 600
              to: 0
            datasourceUid: cloudwatch
            model:
              datasource:
                type: cloudwatch
                uid: cloudwatch
              dimensions: {}
              expression: |
                fields @timestamp, applicationName, @message
                | filter strcontains(@message, "error")
                | stats count(*) as errors by bin(5m), applicationName
              id: ""
              intervalMs: 1000
              label: ""
              logGroups:
                - accountId: "__AWS_ACCOUNT_ID__"
                  arn: "arn:aws:logs:__AWS_REGION__:__AWS_ACCOUNT_ID__:log-group:__MULE_LOG_GROUP__:*"
                  name: "__MULE_LOG_GROUP__"
              matchExact: false
              maxDataPoints: 43200
              metricEditorMode: 0
              metricName: ""
              metricQueryType: 0
              namespace: AWS/ECS
              period: ""
              queryLanguage: CWLI
              queryMode: Logs
              refId: A
              region: "__AWS_REGION__"
              sqlExpression: ""
              statistic: Average
              statsGroups:
                - bin(5m)
                - applicationName
          - refId: B
            queryType: expression
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: expression
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          __dashboardUid__: mule-runtime-logs
          __panelId__: "1"
          summary: 'Mule runtime errors for {{ $labels.applicationName }}'
          description: '{{ $labels.applicationName }} logged {{ $values.B.Value }} errors in the evaluation window.'
          logs_query: |
            fields @timestamp, applicationName, @logStream, @message
            | filter applicationName = "{{ $labels.applicationName }}" and strcontains(@message, "error")
            | sort @timestamp desc
            | limit 50
        labels:
          severity: critical
        notification_settings:
          receiver: mule-runtime-errors-sns
        isPaused: false
