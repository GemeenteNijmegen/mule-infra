apiVersion: 1

groups:
  - orgId: 1
    name: mule-runtime-errors
    folder: Mule
    # Evaluate every 5m against Loki. refId A counts ERROR-level lines per Mule
    # application over a 10m window (from: 600) - two 5m evaluation cycles of
    # overlap to absorb log-ingestion lag.
    interval: 5m
    rules:
      - uid: mule-runtime-errors
        title: Mule runtime errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: |
                sum by (applicationName) (
                  count_over_time({job="mule"} | json | priority="ERROR" [$__range])
                )
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              queryType: instant
          - refId: B
            queryType: expression
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: expression
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          __dashboardUid__: mule-runtime-logs
          __panelId__: "1"
          summary: "Mule runtime errors for {{ $labels.applicationName }}"
          description: "{{ $labels.applicationName }} logged {{ $values.B.Value }} errors in the evaluation window."
          logs_query: |
            {job="mule"} | json | applicationName="{{ $labels.applicationName }}" | priority="ERROR"
        labels:
          severity: critical
        notification_settings:
          receiver: mule-runtime-errors-sns
        isPaused: false
