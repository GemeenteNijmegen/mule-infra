apiVersion: 1

contactPoints:
  - orgId: 1
    name: mule-runtime-errors-sns
    receivers:
      - uid: mule-runtime-errors-sns
        type: sns
        settings:
          api_url: "https://sns.__AWS_REGION__.amazonaws.com"
          topic_arn: "__SNS_TOPIC_ARN__"
          sigv4:
            region: "__AWS_REGION__"
          subject: "Mule Grafana alert"
          message: |
            {{ range .Alerts.Firing -}}
            Mule runtime errors

            Application: {{ if index .Labels "applicationName" }}{{ index .Labels "applicationName" }}{{ else }}unknown{{ end }}
            Count/value: {{ .ValueString }}
            Started: {{ .StartsAt }}

            {{ with .PanelURL -}}
            Logs panel: {{ . }}
            {{ end -}}
            {{ with .DashboardURL -}}
            Dashboard: {{ . }}
            {{ end -}}
            Alert: {{ .GeneratorURL }}
            Silence: {{ .SilenceURL }}

            Logs Insights query:
            fields @timestamp, applicationName, @logStream, @message
            {{ if index .Labels "applicationName" -}}
            | filter applicationName = "{{ index .Labels "applicationName" }}" and strcontains(@message, "error")
            {{ else -}}
            | filter strcontains(@message, "error")
            {{ end -}}
            | sort @timestamp desc
            | limit 50

            {{ end }}
