apiVersion: 1

contactPoints:
  - orgId: 1
    name: mule-runtime-errors-sns
    receivers:
      - uid: mule-runtime-errors-sns
        type: sns
        settings:
          api_url: "https://sns.__AWS_REGION__.amazonaws.com"
          topic_arn: "__SNS_TOPIC_ARN__"
          sigv4:
            region: "__AWS_REGION__"
          # Three shapes of alert reach this contact point: a failing request
          # (entrypoint application plus correlationId), a runtime error that
          # belongs to no request (application only), and a Grafana-side
          # evaluation failure (neither). SNS subjects are capped at 100
          # characters and allow no newlines; a correlationId is a 36-character
          # UUID, which leaves room for an application name.
          subject: "Mule errors: {{ if .CommonLabels.correlationId }}{{ .CommonLabels.applicationName }} request {{ .CommonLabels.correlationId }}{{ else if .CommonLabels.applicationName }}{{ .CommonLabels.applicationName }} (no correlation ID){{ else }}runtime alert{{ end }} ({{ .Status }})"
          # .ExternalURL (GF_SERVER_ROOT_URL) is captured up here because the
          # per-alert scope inside the range cannot see it.
          message: |
            {{ $grafana := .ExternalURL -}}
            {{ range .Alerts -}}
            {{ if index .Labels "applicationName" -}}
            {{ index .Annotations "description" }}

            Started: {{ .StartsAt }}

            {{ if index .Labels "correlationId" -}}
            Debug in Grafana - opens the dashboard with this request's full
            trace loaded, oldest line first, so the entrypoint is at the top:
            {{ else -}}
            Debug in Grafana - opens the dashboard filtered to this application:
            {{ end -}}
            {{ $grafana }}{{ index .Annotations "dashboard_path" }}

            Explore query:
            {{ index .Annotations "logs_query" }}
            Silence this alert: {{ .SilenceURL }}
            {{ else -}}
            Grafana could not evaluate the Mule runtime error alert ({{ index .Labels "alertname" }}).
            Loki is probably unreachable, so Mule errors are NOT being detected right now.
            Alert: {{ .GeneratorURL }}
            {{ end }}
            {{ end -}}
            {{ if not .Alerts -}}
            Grafana sent an SNS notification without alert details.
            Alert: {{ .ExternalURL }}
            {{ end -}}
