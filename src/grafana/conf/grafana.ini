[auth.generic_oauth]
enabled = true
name = Keycloak-OAuth
allow_sign_up = true
client_id = __OAUTH_CLIENT_ID__
client_secret = $__env{GF_OAUTH_CLIENT_SECRET}
scopes = openid email
email_attribute_path = email
auth_url = https://__OAUTH_PROVIDER_DOMAIN__/realms/__OAUTH_REALM__/protocol/openid-connect/auth
token_url = https://__OAUTH_PROVIDER_DOMAIN__/realms/__OAUTH_REALM__/protocol/openid-connect/token
api_url = https://__OAUTH_PROVIDER_DOMAIN__/realms/__OAUTH_REALM__/protocol/openid-connect/userinfo
# Roles are managed in Grafana, not synced from Keycloak; new users start as Viewer.
skip_org_role_sync = true
